profiles:
  P0:
    label: BLOCKING
    engine: EEVEE
    resolution: [270, 480]
    fps: 15
    output: image_sequence
    format: PNG
    color_mode: RGB
    alpha: false
    quality:
      eevee_samples: 8
      volumetric_quality: low
      scatter_density: 0.10
      motion_blur: false
      depth_of_field: false

  P1:
    label: PREVIEW
    engine: EEVEE
    resolution: [540, 960]
    fps: 30
    output: image_sequence
    format: PNG
    color_mode: RGB
    alpha: false
    quality:
      eevee_samples: 32
      volumetric_quality: low
      scatter_density: 0.25
      motion_blur: false
      depth_of_field: false

  P2:
    label: ANIMATIC
    engine: EEVEE
    resolution: [720, 1280]
    fps: 30
    output: image_sequence
    format: PNG
    color_mode: RGB
    alpha: false
    quality:
      eevee_samples: 48
      volumetric_quality: medium
      scatter_density: 0.50
      motion_blur: false
      depth_of_field: false

  P3:
    label: FINAL_EEVEE
    engine: EEVEE
    resolution: [1080, 1920]
    fps: 30
    output: image_sequence
    format: PNG
    color_mode: RGB
    alpha: false
    passes:
      - Combined
    quality:
      eevee_samples: 64
      volumetric_quality: high
      scatter_density: 1.0
      motion_blur: false
      depth_of_field: false

  hero_exr:
    label: HERO_COMPOSITE
    engine: EEVEE
    resolution: [1080, 1920]
    fps: 30
    output: image_sequence
    format: OPEN_EXR
    color_mode: RGBA
    color_depth: 16
    alpha: true
    passes:
      - Combined
      - Normal
      - Vector
      - Mist
    quality:
      eevee_samples: 64
      volumetric_quality: high
      scatter_density: 1.0
      motion_blur: false
      depth_of_field: false

  final_cycles:
    label: FINAL_CYCLES
    engine: CYCLES
    resolution: [1080, 1920]
    fps: 30
    output: image_sequence
    format: PNG
    color_mode: RGB
    alpha: false
    passes:
      - Combined
    quality:
      max_samples_from_benchmark: true
      adaptive_sampling: true
      denoise: true

preview_proxy:
  codec: libx264
  pixel_format: yuv420p
  crf: 20
  preset: medium
