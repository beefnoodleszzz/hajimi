[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hajimi"
version = "2.0.0"
description = "Deterministic, QC-first visual storytelling studio orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
media-qc = [
  "faster-whisper>=1.1,<2",
  "opencv-python-headless>=4.8,<5",
  "scenedetect>=0.6,<0.7",
]
analytics = [
  "duckdb>=1.0,<2",
]

[project.scripts]
hajimi = "studio.cli:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
