    subject_motion: body and receipt travel right; road does not
    screen_direction: right
    visual_information: inertia is horizontal, not upward
    transition_in: rightward motion match
    transition_out: vector line match
    sound_event: body whoosh + paper tick
    expected_duration: 2.8
