    composition: low road-level wide, horizon in upper third
    lens: 28mm equivalent
    camera_height: 1.2m
    camera_motion: locked after snap
    subject_motion: receipt starts moving right
    screen_direction: right
    visual_information: ground is fixed; event occurs before explanation
    transition_in: hard cut from black
    transition_out: match direction into human silhouette
    sound_event: vacuum-drop + impact
    expected_duration: 1.2
    production_method: animatic_card_then_ai_video
