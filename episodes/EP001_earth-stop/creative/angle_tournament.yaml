schema_version: angle-tournament-v2
episode_id: EP001_earth-stop
method: parallel-agent-pairwise-reasoning-with-mutation-and-composite-selection
shortlist:
- motion_ledger
- shadow_receipt
- restart_window
- atmosphere_window
- shared_frame
- key_momentum
angle_mutations:
- id: M01
  source: motion_ledger
  mode: personal_pov
  change: start from a tiny object before revealing the layers
- id: M02
  source: motion_ledger
  mode: system_pov
  change: open on the shared frame splitting
- id: M03
  source: shadow_receipt
  mode: scale_first
  change: use the shadow as a recurring ruler
- id: M04
  source: restart_window
  mode: consequence_first
  change: show the restart before explaining the stop
- id: M05
  source: atmosphere_window
  mode: mystery_first
  change: let the sky slide through a fixed window
- id: M06
  source: shared_frame
  mode: visual_first
  change: make the doubled horizon the first anomaly
- id: M07
  source: key_momentum
  mode: minimal_narration
  change: let the object and vector carry the first line
- id: M08
  source: body_vector
  mode: counterintuitive_explanation
  change: correct sideways versus up before spectacle
- id: M09
  source: ocean_seam
  mode: consequence_first
  change: use the coastline seam as the irreversible reveal
- id: M10
  source: three_clocks
  mode: system_pov
  change: convert synchronization into a physical layer graphic
- id: M11
  source: horizon_split
  mode: personal_pov
  change: hold the camera still while baselines disagree
- id: M12
  source: equator_ruler
  mode: scale_first
  change: make one second a ruler that every layer inherits
comparisons:
- left: motion_ledger
  right: shadow_receipt
  stronger: motion_ledger
  reasoning: It preserves the intimate proof while paying off with a system cross-section;
    shadow_receipt is a useful recurring motif.
  dimensions:
    hook: motion_ledger
    visual: motion_ledger
    escalation: motion_ledger
    originality: shadow_receipt
    production_fit: motion_ledger
  counterargument: shadow_receipt is cheaper but risks a too-subtle opening.
- left: motion_ledger
  right: restart_window
  stronger: restart_window
  reasoning: The restart creates a visible reversal and delayed payoff that the stop-only
    framing lacks.
  dimensions:
    hook: restart_window
    visual: restart_window
    escalation: restart_window
    originality: restart_window
    production_fit: motion_ledger
  counterargument: restart_window needs strict layer continuity.
- left: atmosphere_window
  right: shared_frame
  stronger: shared_frame
  reasoning: The doubled frame explains the mechanism more directly than a scenic
    window while retaining the moving-air reveal.
  dimensions:
    hook: shared_frame
    visual: shared_frame
    escalation: shared_frame
    originality: atmosphere_window
    production_fit: shared_frame
  counterargument: atmosphere_window is more immediately cinematic but can become
    decorative.
- left: key_momentum
  right: body_vector
  stronger: key_momentum
  reasoning: A small object stays readable at every scale and avoids an overacted
    human launch.
  dimensions:
    hook: key_momentum
    visual: key_momentum
    escalation: body_vector
    originality: key_momentum
    production_fit: key_momentum
  counterargument: body_vector carries more emotional danger.
- left: ocean_seam
  right: equator_ruler
  stronger: ocean_seam
  reasoning: The seam supplies irreversible consequence after the ruler supplies comprehension.
  dimensions:
    hook: equator_ruler
    visual: ocean_seam
    escalation: ocean_seam
    originality: ocean_seam
    production_fit: equator_ruler
  counterargument: ruler alone is clearer but too infographic-like.
- left: shared_frame
  right: restart_window
  stronger: restart_window
  reasoning: Use shared_frame as the explanatory hero language but let restart_window
    supply the story turn.
  dimensions:
    hook: shared_frame
    visual: shared_frame
    escalation: restart_window
    originality: restart_window
    production_fit: shared_frame
  counterargument: a pure frame split risks feeling abstract without the restart event.
selected_direction:
  hook_from: key_momentum
  visual_motif_from: shadow_receipt
  escalation_from: restart_window
  payoff_from: shared_frame
  ending_from: ocean_seam
  rationale: Start with a tiny key crossing a locked surface, reuse its shadow as
    a measurement mark, then escalate through a restart that reveals land/air/ocean
    offsets. The composite wins because it keeps the anomaly tactile and the payoff
    systemic.
selection_status: composite_agent_direction
