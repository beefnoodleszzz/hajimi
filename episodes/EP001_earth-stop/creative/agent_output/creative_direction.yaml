schema_version: creative-direction-v2
episode_id: EP001_earth-stop
core_question: What keeps moving when the ground stops?
core_answer: A sudden surface stop does not erase the motion already carried by bodies, air, and water; it breaks their shared reference frame.
one_sentence_promise: A tiny key crosses a frozen surface, then the same motion splits Earth into layers that no longer agree.
hook_type: tactile_object_anomaly
hero_shot_type: layered_reference_frame_restart
viewer_promise: The audience will see one familiar object become evidence of a planetary coordination failure.
viewer_emotion_curve: [curiosity, recognition, danger, scale, awe, open question]
opening:
  first_frame: close road-level table-like surface with a metal key and a hard horizon
  first_second_action: surface locks while the key and its dust shadow continue east
  first_line: The ground can stop without taking your motion with it.
  anomaly_time_sec: 0.4
narrative_engine:
  central_visual_motif: moving object plus displaced shadow mark
  escalation_pattern: object to body to measured distance to air to ocean to shared frame
  transformation_pattern: harmless motion becomes evidence that Earth is not one rigid state
visual_peaks:
  - {time: 0.4, tier: CONNECTOR, idea: key crosses a locked surface}
  - {time: 8.0, tier: STORY, idea: one-second ruler turns velocity into distance}
  - {time: 18.0, tier: STORY, idea: atmosphere slides through a fixed horizon}
  - {time: 26.0, tier: HERO, idea: restart reveals four layers with separate offsets}
  - {time: 32.0, tier: CONNECTOR, idea: displaced shadow closes the loop}
hero_shot:
  shot_id: S006
  concept: orthographic motion ledger at restart, with locked land, offset air and ocean, and the key's vector preserved
  why_memorable: One readable frame explains both the mechanism and the consequence without relying on destruction spectacle.
  deletion_cost: Removing it leaves the audience with a metaphor but no causal picture.
ending:
  payoff: The disaster is the loss of a shared frame, not a fireball.
  loop_or_comment_hook: If the ground restarts first, which layer would you trust?
reject:
  generic_angles: [planet explodes, people fly straight into space, city destruction montage]
  boring_explanations: [speed statistic over scenic Earth, paragraph narration over stock clouds]
  visual_cliches: [unmotivated camera shake, random debris, unreadable infographic wall]
