schema_version: visual-concept-v2
episode_id: EP001_earth-stop
visual_language:
  visual_thesis: A small moving witness exposes a layered planet that no longer shares
    one baseline.
  motif: metal key + displaced shadow + cyan motion ledger
  scale_language: object to hand to street to atmosphere to ocean to coupled system
  movement_language: eastward continuation against locked references; no random shake
  lighting_language: ordinary warm surface, cool cyan layer separation at the anomaly
  color_language: charcoal base, cyan information, red measurement mark, steel key
  contrast: one boundary or vector per frame
  texture: brushed metal, road grit, dust edge, cloud shear, water seam
hero_frames:
- shot_id: S006
  concept: layered reference-frame restart
  composition: four horizontal bands with a key vector crossing the locked land band
  foreground: land and key
  midground: air band
  background: ocean band
  subject_action: land snaps while upper layers lag east
  camera: orthographic side cutaway
  production_method: blender_ai_hybrid
shots:
- shot_id: S001
  tier: CONNECTOR
  visual_goal: Make the anomaly legible before explanation
  composition: key on a dark surface with a hard horizon
  focal_subject: metal key and dust shadow
  camera: low locked macro
  action: surface freezes while key crosses
  transition: hard cut from black
  method_candidates:
  - blender
  - ai_video
- shot_id: S002
  tier: STORY
  visual_goal: Transfer the retained motion from object to body
  composition: hand reaches for the key as the mark stays behind
  focal_subject: hand/key/mark
  camera: rear three-quarter medium
  action: hand inherits eastward motion
  transition: match on key edge
  method_candidates:
  - ai_video
  - blender
- shot_id: S003
  tier: CONNECTOR
  visual_goal: Convert rotation into measurable distance
  composition: one-second ruler crosses a sparse street grid
  focal_subject: ruler and 465 m label
  camera: orthographic overhead
  action: endpoint snaps into place
  transition: key trajectory becomes ruler
  method_candidates:
  - fusion
  - blender
- shot_id: S004
  tier: STORY
  visual_goal: Show air as a moving layer
  composition: fixed window bars over a sliding cloud band
  focal_subject: cloud band and baseline
  camera: locked side view
  action: cloud texture shears through frame
  transition: ruler line becomes cloud edge
  method_candidates:
  - blender
  - ai_video
- shot_id: S005
  tier: STORY
  visual_goal: Add the ocean without scenic filler
  composition: coastline seam with locked land and moving water
  focal_subject: land/water boundary
  camera: elevated side cutaway
  action: water line continues east
  transition: cloud edge becomes coast seam
  method_candidates:
  - blender
  - ai_video
- shot_id: S006
  tier: HERO
  visual_goal: Deliver the causal explanation in one frame
  composition: four clean horizontal layers with offset baselines and key vector
  focal_subject: LAND/AIR/OCEAN/BODY relationship
  camera: orthographic scientific cutaway
  action: land restarts while upper layers lag
  transition: impact cut from coast
  method_candidates:
  - blender
  - fusion
  - ai_image
- shot_id: S007
  tier: STORY
  visual_goal: Correct vertical-flight misconception
  composition: down arrow stays while eastward arrow expands
  focal_subject: body silhouette and down/east arrows
  camera: centered graphic
  action: sideways vector grows
  transition: layer offsets become arrows
  method_candidates:
  - fusion
- shot_id: S008
  tier: CONNECTOR
  visual_goal: Close the loop with the original witness
  composition: original key and shadow mark now separated
  focal_subject: key/mark
  camera: same locked macro as opening
  action: dust settles beyond mark
  transition: match S001
  method_candidates:
  - blender
  - ai_image
rejections:
- scenic coastline without causal seam
- static AI plate under long narration
- repeated camera logic
- dense labels that hide the moving boundary
