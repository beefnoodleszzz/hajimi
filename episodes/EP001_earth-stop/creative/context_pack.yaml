research_summary:
  topic_brief: '# EP001 Topic Brief


    ## Question


    What would happen if Earth’s rotation stopped for exactly one second?


    ## Counter-intuitive point


    The road can be imagined to stop while a person, loose objects, air, and water

    retain eastward tangential motion.


    ## Payoff


    At the equator, the simplified first-order model gives roughly 465 metres of

    relative movement in one second. Gravity remains; the dangerous vector is

    sideways.


    ## Visual peaks


    1. The ground locks before the explanation begins.

    2. `465 m/s` becomes a visible `465 m` trajectory.

    3. Land, air, and water restart out of alignment.


    ## Shorts fit


    Strong fit: the thought experiment has an immediate anomaly, a personal

    consequence, a scale reveal, and a loopable callback. It can expand into a

    long-form episode about angular momentum, atmosphere, oceans, and latitude.


    ## Guardrail


    This is a magical instantaneous-stop thought experiment, not a real mechanism

    or a full geophysical simulation. Claims, inferences, and simplifications are

    kept separate in `fact_pack.md`.

    '
  fact_pack: "# EP001 Fact Pack\n\nResearch basis retained from the previous project\
    \ only as verified facts and\nsources. No old wording, shot list, subtitle, voice,\
    \ or render is reused.\n\n## Confirmed facts\n\n- Earth rotates once per solar\
    \ day; the sidereal period is about 23 h 56 min.\n- NASA GSFC gives an equatorial\
    \ surface speed of about 465 m/s.\n- In the instantaneous-stop thought experiment,\
    \ unattached objects retain\n  eastward tangential motion and the speed depends\
    \ on latitude.\n- Gravity remains; equatorial tangential speed is not enough to\
    \ launch people\n  into space.\n- Earth’s rotation affects the direction of moving\
    \ air and ocean currents via\n  the Coriolis effect.\n\n## Simplified derivations\n\
    \n- At the equator, `d ≈ v × t ≈ 465 m/s × 1 s ≈ 465 m`.\n- In a spherical approximation,\
    \ `v(latitude) ≈ 465 × cos(latitude) m/s`.\n- “Land, air, and water are no longer\
    \ aligned after restart” is an inference,\n  not a numerical disaster simulation.\n\
    \n## Sources\n\n- [NASA Science — Reference Systems](https://science.nasa.gov/learn/basics-of-space-flight/chapter2-1/)\n\
    - [NASA GSFC — The Rotating Earth](https://pwg.gsfc.nasa.gov/stargaze/Srotfram1.htm)\n\
    - [NASA Cosmicopia — Earth and Moon Q&A](https://cosmicopia.gsfc.nasa.gov/qa_earth.html)\n\
    - [NOAA JetStream — Origin of Wind](https://www.noaa.gov/jetstream/synoptic/origin-of-wind)\n\
    - [NOAA National Ocean Service — Coriolis Effect](https://oceanservice.noaa.gov/education/tutorial_currents/04currents1.html)\n\
    \n## Rejected claims\n\nThe script does not claim that everybody moves at 1,000\
    \ mph, flies into space,\ncreates a quantified mega-tsunami, makes the atmosphere\
    \ disappear, or causes\nEarth to explode.\n"
