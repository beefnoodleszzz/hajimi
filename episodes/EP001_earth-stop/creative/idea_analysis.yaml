- id: personal_pov
  title_working: Your Camera Does Not Agree
  premise: A first-person view makes the viewer's own reference frame fail.
  viewer_question: Would your eyes see the stop before your body feels the mismatch?
  surprising_fact: The camera can remain stable while the world moves through it.
  emotional_driver: embodied disorientation
  hook_potential:
    first_second_event: A phone-level POV freezes its horizon while a receipt streaks
      past.
    first_visual: A phone-level POV freezes its horizon while a receipt streaks past.
    contradiction: The camera can remain stable while the world moves through it.
    curiosity_gap: Would your eyes see the stop before your body feels the mismatch?
  visual_potential:
