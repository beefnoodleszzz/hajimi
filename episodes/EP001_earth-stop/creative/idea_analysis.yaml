- id: city_scale_destruction
  title_working: The City Slides First
  premise: A city-scale slice reveals the mismatch as infrastructure, air, and water
    decouple.
  viewer_question: What breaks when an entire city loses its shared reference frame?
  surprising_fact: The disaster is a coordination failure between layers.
  emotional_driver: scale dread
  hook_potential:
    first_second_event: Road grids freeze while the skyline and air layer keep sliding.
    first_visual: Road grids freeze while the skyline and air layer keep sliding.
    contradiction: The disaster is a coordination failure between layers.
    curiosity_gap: What breaks when an entire city loses its shared reference frame?
  visual_potential:
    opening_visual: Road grids freeze while the skyline and air layer keep sliding.
    escalation_visual_1: street grid to skyline
    escalation_visual_2: city slab against atmosphere and coast
    hero_visual: a vertical city cutaway with one locked plane and two moving planes
    ending_visual: the grid resets but one red object remains displaced
  story_potential:
    setup: A city-scale slice reveals the mismatch as infrastructure, air, and water
      decouple.
    escalation: street grid to skyline → city slab against atmosphere and coast
    payoff: a vertical city cutaway with one locked plane and two moving planes
    loop: the grid resets but one red object remains displaced
  production_fit: *id001
  novelty:
    common_existing_angle: Earth stops and everything breaks immediately.
    alternative_angle: Turns a planet thought experiment into a legible urban machine.
    our_distinctive_angle: Road grids freeze while the skyline and air layer keep
