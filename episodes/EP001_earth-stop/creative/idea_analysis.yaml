- id: system_layer_mismatch
  title_working: Earth Stops Being One System
  premise: The land stops first, but the coupled layers retain different motion.
  viewer_question: What does 'Earth stopped' actually mean when Earth is several moving
    systems?
  surprising_fact: The word Earth hides land, air, water, and bodies with different
    responses.
  emotional_driver: awe through structure
  hook_potential:
    first_second_event: A single horizontal line fractures into land, air, and ocean.
    first_visual: A single horizontal line fractures into land, air, and ocean.
    contradiction: The word Earth hides land, air, water, and bodies with different
      responses.
    curiosity_gap: What does 'Earth stopped' actually mean when Earth is several moving
      systems?
  visual_potential:
    opening_visual: A single horizontal line fractures into land, air, and ocean.
    escalation_visual_1: one vector branches into three layers
    escalation_visual_2: layers restart at different times
    hero_visual: a still-readable system cross-section where land is locked and upper
      layers lag right
    ending_visual: three layers collapse into one unresolved question
  story_potential:
    setup: The land stops first, but the coupled layers retain different motion.
    escalation: one vector branches into three layers → layers restart at different
      times
    payoff: a still-readable system cross-section where land is locked and upper layers
      lag right
    loop: three layers collapse into one unresolved question
  production_fit: *id001
  novelty:
    common_existing_angle: Earth stops and everything breaks immediately.
    alternative_angle: Reframes the what-if as a failure of shared reference, not
      a single explosion.
    our_distinctive_angle: A single horizontal line fractures into land, air, and
      ocean. grows into a still-readable system cross-section where land is locked
      and upper layers lag right instead of becoming a paragraph of exposition.
  risk:
    factual_uncertainty: The one-second stop is a thought experiment; label the simplification.
