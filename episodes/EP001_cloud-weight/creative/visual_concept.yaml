visual_language:
  palette: deep navy, cloud white, wet cyan, warm amber for measurement
  motif: cloud silhouette transforms into a transparent volume of droplets and airflow
  typography: condensed uppercase labels used only for numbers and causal contrasts
  continuity_anchor: cloud stays screen-right; air arrows rise from bottom to top; rain exits downward
hero_frames: [S001, S006]
shots:
  - {shot_id: S001, tier: HERO, visual_goal: make the weight contradiction readable without audio, composition: centered cloud on a low industrial scale with empty sky above, focal_subject: cloud and scale pan, camera: locked frontal with a tiny push-in, action: cloud settles and scale reacts, transition: hard impact cut into readout, method_candidates: [ai_image, fusion]}
  - {shot_id: S002, tier: STORY, visual_goal: anchor the number to an explicit estimate, composition: cloud expands inside a glowing one-kilometre cube, focal_subject: cube volume and tonnage readout, camera: orbiting perspective move, action: cube outline snaps around cloud, transition: cube edges become Fusion calculation lines, method_candidates: [ai_image, ai_i2v, fusion]}
  - {shot_id: S003, tier: STORY, visual_goal: show that the counted water is liquid droplets, composition: opaque cloud peels open into sparse droplets, focal_subject: droplets suspended in cloud volume, camera: cinematic macro dive forward, action: cloud surface dissolves and droplets drift, transition: droplet match cut into density graphic, method_candidates: [ai_image, ai_i2v]}
  - {shot_id: S004, tier: STORY, visual_goal: make the density relationship visible, composition: split vertical frame with dry air left and cloudy air right, focal_subject: two atmospheric columns and relative motion, camera: straight-on with gentle parallax, action: cloudy column rises, transition: motion becomes Fusion arrows, method_candidates: [ai_image, ai_i2v, fusion]}
  - {shot_id: S005, tier: STORY, visual_goal: introduce the updraft as an active force, composition: camera below a cloud base looking upward, focal_subject: upward airflow carrying droplets, camera: vertical tilt and rise, action: droplets climb through moist air, transition: camera enters the cloud, method_candidates: [ai_image, ai_i2v]}
  - {shot_id: S006, tier: HERO, visual_goal: unify water, air, and motion in one causal cutaway, composition: transparent cloud layer spanning frame with droplets and sunlight edge, focal_subject: droplet field inside moving moist air, camera: slow lateral dolly through the layer, action: water rises while cloud volume drifts, transition: growing droplet exits the layer, method_candidates: [ai_image, ai_i2v, fusion]}
  - {shot_id: S007, tier: STORY, visual_goal: show the threshold where rain begins, composition: close-up of three droplet states crossing the cloud base, focal_subject: one growing droplet and weakening updraft, camera: compressed telephoto push, action: suspended to lifted to falling, transition: rain streak wipes to opening silhouette, method_candidates: [ai_image, ai_multiframe]}
  - {shot_id: S008, tier: CONNECTOR, visual_goal: close the paradox and invite replay, composition: S001 scale composition returns with cloud hovering above it, focal_subject: cloud silhouette and final contrast label, camera: match frame to S001 then reverse micro-push, action: a droplet rises back into the cloud, transition: seamless loop, method_candidates: [ai_image, ai_i2v, fusion]}
rejections: [stock cloud montage, talking-head explanation, unsupported universal 551-ton claim, static title card over four seconds, AI plate without shot continuity]
