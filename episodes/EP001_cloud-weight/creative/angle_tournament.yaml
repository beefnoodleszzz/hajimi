schema_version: angle-tournament-v2
angle_mutations:
  - {id: M01, source_candidate: cloud_scale, angle: Start with a cloud physically landing on a scale, then reveal the estimate's exact conditions.}
  - {id: M02, source_candidate: rain_machine, angle: Treat the cloud as a vertical race between falling droplets and rising air.}
  - {id: M03, source_candidate: density_floor, angle: Make invisible dense/dry air into a visible support layer.}
  - {id: M04, source_candidate: cloud_container, angle: Ask what the scale is actually counting before giving the number.}
  - {id: M05, source_candidate: cloud_balance, angle: Build suspense around the moment the cloud's lift budget tips into rain.}
  - {id: M06, source_candidate: cloud_xray, angle: Turn an opaque cloud into a transparent droplet volume.}
  - {id: M07, source_candidate: sky_scale, angle: Draw a one-kilometre cube around a familiar cloud before counting water.}
  - {id: M08, source_candidate: heavy_float, angle: Use heavy and floating as the contradiction the video resolves.}
  - {id: M09, source_candidate: cloud_accounting, angle: Print a cloud receipt, then collapse it into the physical cutaway.}
  - {id: M10, source_candidate: cotton_false, angle: Break the soft cotton illusion before showing the water-bearing interior.}
comparisons:
