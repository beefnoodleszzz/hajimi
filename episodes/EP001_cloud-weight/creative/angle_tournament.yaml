  - {left: M01, right: M08, stronger: M01, reasoning: Both use contradiction, but a physical scale is more legible than a text label in the sky., dimensions: {hook: 5, visual_clarity: 5, novelty: 4, escalation: 4, emotion: 4, defensibility: 5, production_fit: 5, hero_potential: 5, loop_potential: 5}, counterargument: M08 gives the cleanest title language.}
