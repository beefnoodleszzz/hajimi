  - {left: M01, right: M03, stronger: M01, reasoning: The scale gives a concrete object before the abstract density explanation., dimensions: {hook: 5, visual_clarity: 5, novelty: 4, escalation: 5, emotion: 4, defensibility: 5, production_fit: 5, hero_potential: 5, loop_potential: 4}, counterargument: M03 may explain buoyancy more cleanly but risks a lecture feel.}
  - {left: M01, right: M04, stronger: M01, reasoning: The number is more memorable when the viewer first sees a scale; definition can be a quick clarification., dimensions: {hook: 5, visual_clarity: 5, novelty: 4, escalation: 5, emotion: 4, defensibility: 5, production_fit: 5, hero_potential: 5, loop_potential: 5}, counterargument: M04 is safer scientifically if the estimate scope is misunderstood.}
  - {left: M01, right: M05, stronger: M01, reasoning: A scale is a stronger first-second anomaly; the tipping point is a better mid-video escalation., dimensions: {hook: 5, visual_clarity: 5, novelty: 4, escalation: 5, emotion: 4, defensibility: 5, production_fit: 5, hero_potential: 5, loop_potential: 5}, counterargument: M05 has more tension but less immediate context.}
  - {left: M01, right: M06, stronger: M01, reasoning: The scale reads without narration, while x-ray is a powerful second beat rather than the opening., dimensions: {hook: 5, visual_clarity: 5, novelty: 4, escalation: 5, emotion: 4, defensibility: 5, production_fit: 5, hero_potential: 5, loop_potential: 5}, counterargument: M06 supplies the strongest material reveal.}
