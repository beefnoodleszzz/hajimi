selected_direction:
  hook_from: M01
  visual_motif_from: M06
  escalation_from: M07
  payoff_from: M05
  ending_from: M08
  rationale: "Use the scale for the mute-readable hook, x-ray droplets for the material reveal, the one-kilometre cube for defensible arithmetic, the lift-limit/rain threshold for motion and payoff, and the heavy-but-floating phrase for the loop. One promise remains: weight is real, but floating is a density relationship."
