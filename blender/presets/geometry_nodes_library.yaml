schema_version: hajimi-geometry-nodes-v1
default_mode: PREVIEW
groups:
  - name: HJ_DebrisScatter
    purpose: Instance debris on a surface with preview/final density.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_DustTrail
    purpose: Directional dust trail driven by motion.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_VectorTrail
    purpose: Readable vector and motion trail.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_ImpactWave
    purpose: Procedural impact ring with controlled falloff.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_CityRepeater
    purpose: Instanced city block repetition without object explosion.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_CloudLayerGuide
    purpose: Preview-safe cloud layer guide for exterior shots.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_OceanSurface
    purpose: Shader/geometry guide for non-hero water surfaces.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_ProceduralRoad
    purpose: Deterministic road and lane dressing.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_ArrowVector
    purpose: Scientific direction arrows with stable orientation.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_ScaleMarkers
    purpose: Reusable human/scale markers.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_ParticleBurst
    purpose: Low-cost procedural burst for impact accents.
    inputs: [Geometry, Density, Seed, Mode]
  - name: HJ_AtmosphericDust
    purpose: Camera-aware atmospheric dust instances.
    inputs: [Geometry, Density, Seed, Mode]
